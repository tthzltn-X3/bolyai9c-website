name = "bolyai9c-website"
main = "main.js"
compatibility_date = "2026-11-20"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "data"
database_id = "54b1452f-c775-4565-b8d5-155dae2a88b5"

[assets]
directory = "."

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
